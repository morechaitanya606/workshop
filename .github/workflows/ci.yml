name: CI

on:
  pull_request:
  push:

jobs:
  app-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          # Required at build time for metadataBase (getAppUrl); runtime uses the
          # real production/Vercel env. A stable placeholder is fine for CI.
          NEXT_PUBLIC_APP_URL: "https://onlyworkshops.com"

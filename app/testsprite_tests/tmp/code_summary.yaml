version: "2"
type: backend
tech_stack:
  - TypeScript
  - Next.js (App Router)
  - Supabase (Postgres)
  - Resend (Email)
  - Razorpay (Payments)
  - Framer Motion (Animations)
features:
  - name: Workshop Discovery and Booking
    description: Explore workshops, view details, and book seats with online payment.
    files:
      - src/app/page.tsx
      - src/app/explore/page.tsx
      - src/app/workshop/[id]/page.tsx
      - src/app/api/workshops/route.ts
      - src/app/api/workshops/[id]/route.ts
      - src/app/api/bookings/route.ts
      - src/app/api/bookings/checkout/route.ts
      - src/lib/data.ts
    endpoints:
      - method: GET
        path: /api/workshops
        description: List available workshops with filters.
        auth_required: false
        response_schema:
          "200": Workshop[]
      - method: GET
        path: /api/workshops/{id}
        description: Get details for a single workshop.
        auth_required: false
        response_schema:
          "200": Workshop
          "404": Not found
      - method: POST
        path: /api/bookings
        description: Create a new booking for a workshop.
        auth_required: true
        request_schema:
          body:
            workshopId: string
            seats: number
        response_schema:
          "200": Booking
          "400": Validation error
      - method: POST
        path: /api/bookings/checkout
        description: Create or confirm a payment session for a booking.
        auth_required: true
        request_schema:
          body:
            bookingId: string
        response_schema:
          "200": CheckoutSession
          "400": Payment error
  - name: Authentication and Profile
    description: User authentication, session management, and profile data.
    files:
      - src/app/auth/login/page.tsx
      - src/app/auth/signup/page.tsx
      - src/app/api/auth/me/route.ts
      - src/app/api/profile/route.ts
      - src/lib/auth-context.tsx
      - src/lib/api-auth.ts
    endpoints:
      - method: GET
        path: /api/auth/me
        description: Get the current authenticated user.
        auth_required: true
        response_schema:
          "200": User
          "401": Unauthorized
      - method: GET
        path: /api/profile
        description: Get profile details for the current user.
        auth_required: true
        response_schema:
          "200": UserProfile
          "401": Unauthorized
      - method: PUT
        path: /api/profile
        description: Update profile details for the current user.
        auth_required: true
        request_schema:
          body:
            name: string
            phone?: string
        response_schema:
          "200": UserProfile
          "400": Validation error
  - name: Host Applications and Admin Management
    description: Host onboarding, admin dashboards, analytics, and workshop management.
    files:
      - src/app/api/host-applications/route.ts
      - src/app/api/admin/workshops/route.ts
      - src/app/api/admin/workshops/[id]/route.ts
      - src/app/api/admin/registrations/route.ts
      - src/app/api/admin/stats/route.ts
      - src/app/admin/dashboard/page.tsx
      - src/lib/admin-dashboard-data.ts
    endpoints:
      - method: POST
        path: /api/host-applications
        description: Submit a new host application.
        auth_required: true
        request_schema:
          body:
            name: string
            phone: string
            experience: string
        response_schema:
          "200": HostApplication
          "400": Validation error
      - method: GET
        path: /api/admin/workshops
        description: List all workshops for admin management.
        auth_required: true
        response_schema:
          "200": Workshop[]
      - method: GET
        path: /api/admin/stats
        description: Get aggregate analytics for admin dashboard.
        auth_required: true
        response_schema:
          "200": AdminStats
  - name: Feedback and Notifications
    description: Collect feedback and send transactional emails for workshops.
    files:
      - src/app/api/workshops/[id]/feedback/route.ts
      - src/app/api/workshops/[id]/public-feedback/route.ts
      - src/app/api/admin/feedback/route.ts
      - src/app/api/cron/emails/route.ts
      - src/emails/FeedbackRequest.tsx
      - src/emails/WorkshopReminder.tsx
      - src/lib/email.ts
      - src/lib/payment-notifications.ts
    endpoints:
      - method: POST
        path: /api/workshops/{id}/feedback
        description: Submit feedback for a workshop.
        auth_required: true
        request_schema:
          body:
            rating: number
            comment?: string
        response_schema:
          "200": Feedback
          "400": Validation error
      - method: GET
        path: /api/workshops/{id}/public-feedback
        description: List public feedback for a workshop.
        auth_required: false
        response_schema:
          "200": Feedback[]
      - method: POST
        path: /api/cron/emails
        description: Trigger scheduled email notifications.
        auth_required: true
        response_schema:
          "200": { "status": "ok" }
          "500": Internal error
known_limitations:
  - issue: Some API endpoints rely on external services (Supabase, Resend, Razorpay) and may fail if environment variables are missing or services are unavailable.
    location: src/lib/api-client.ts
    impact: Runtime errors or failed network requests in non-production or misconfigured environments.
  - issue: Rate limiting and abuse protection are minimal for several public-facing endpoints.
    location: src/app/api
    impact: High-volume traffic could cause degraded performance or abuse without additional safeguards.


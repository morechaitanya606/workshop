<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your verification code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#fefbea;">
    <!-- Only Workshops auth email. Source: app/supabase/templates (see README.md there). -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fefbea;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background-color:#ffffff;border:1px solid #f3e6dc;border-radius:16px;">
            <tr>
              <td style="padding:28px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:20px;color:#1F1F1F;">
                Only Workshops
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px;font-family:Arial,Helvetica,sans-serif;">
                <h1 style="margin:0 0 12px 0;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.3;font-weight:normal;color:#1F1F1F;">Your verification code</h1>
                <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#4A4A4A;">Enter this code to confirm it is you:</p>
                <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:32px;letter-spacing:8px;font-weight:bold;color:#1F1F1F;">{{ .Token }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 28px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#666666;">
                The code expires after a short time. If you did not ask for it, someone may be trying to change your account: change your password.
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#666666;">
            Only Workshops &middot; Hands-on creative workshops in your city
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
